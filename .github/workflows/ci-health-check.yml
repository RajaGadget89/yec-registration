name: CI Health Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health_check:
    name: System Health Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Add fork protection - only run if PR is from same repo (has secrets)
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      # Use your existing .e2e-env configuration
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # Consistent with your system - PORT 8080
      NEXT_PUBLIC_SITE_URL: http://localhost:8080
      E2E_BASE_URL: http://localhost:8080
      # Core service flags
      FEATURES_ADMIN_MANAGEMENT: "true"
      E2E_TESTS: "true"
      E2E_TEST_MODE: "true"
      TEST_HELPERS_ENABLED: "1"
      # Security - use the new rotated CRON_SECRET
      CRON_SECRET: "d2188fe03a5b783bc37ba30556a1bc596c447b1c5bca431056f0381f11f0b20b"
      SUPABASE_ENV: "staging"
      # Email configuration - use actual values from .e2e-env
      EMAIL_MODE: "CAPPED"
      DISPATCH_DRY_RUN: "false"
      E2E_DB_TARGET: "staging"
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      
      - name: Start application server
        run: |
          nohup npm run dev -- --port=8080 &
          sleep 15
          
      - name: Run health validation tests
        run: |
          npx playwright test tests/e2e/ci-health-check.spec.ts \
            --config=playwright.ci-health.config.ts \
            --reporter=line \
            --timeout=30000

      # Add explicit commit status reporting for ruleset compatibility
      - name: Report required context (ruleset-compat)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const stateMap = { success: 'success', failure: 'failure', cancelled: 'failure' };
            const state = stateMap[process.env.JOB_STATUS] || 'failure';
            const sha = context.payload.pull_request.head.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'CI Health Check / System Health Validation (pull_request)',
              description: `Reported from run ${context.runId}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
